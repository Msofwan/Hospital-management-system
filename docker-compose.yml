services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hms"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://hms:hms_password@db:5432/hms
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./public-frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:8000
        NEXT_PUBLIC_PATIENT_PORTAL_URL: /patient-portal
        PORT: 3000
    env_file:
      - ./public-frontend/.env
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"

  internal-frontend:
    build:
      context: ./internal-frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_APP_PORT: 5173
    env_file:
      - ./internal-frontend/.env
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  postgres-data:
